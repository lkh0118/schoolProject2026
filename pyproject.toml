[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-review"
version = "0.1.0"
description = "Local-first, evidence-grounded post-match review for Delta Force recordings"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "opencv-python-headless>=4.10,<5",
  "av>=14,<17", "numpy>=2,<3", "psutil>=6,<8"
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
delta-review = "delta_review.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
